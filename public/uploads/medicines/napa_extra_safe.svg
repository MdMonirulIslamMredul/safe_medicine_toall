<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSafe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="hologramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="33%" stop-color="#a855f7"/>
      <stop offset="66%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="450" fill="url(#bgSafe)" rx="16"/>
  <rect x="2" y="2" width="596" height="446" fill="none" stroke="#10b981" stroke-width="3" rx="14"/>
  
  <!-- Top Tag -->
  <rect x="30" y="24" width="220" height="34" rx="17" fill="#059669"/>
  <text x="50" y="47" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">✓ AUTHENTIC PACKAGING</text>
  
  <!-- Medicine Box & Blister Pack Illustration -->
  <!-- Box -->
  <rect x="60" y="80" width="220" height="300" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.1))"/>
  <rect x="60" y="80" width="220" height="70" rx="10 10 0 0" fill="#1e3a8a"/>
  <text x="80" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Napa Extra</text>
  <text x="80" y="142" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#93c5fd">Paracetamol 500mg + Caffeine 65mg</text>
  
  <!-- Hologram Seal -->
  <rect x="180" y="165" width="80" height="40" rx="6" fill="url(#hologramGrad)"/>
  <text x="190" y="188" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">3D SECURITY</text>
  <text x="196" y="199" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" fill="#ffffff">HOLOGRAM</text>
  
  <text x="80" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Beximco Pharma</text>
  <text x="80" y="220" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">DAR: 025-0145-022</text>
  <text x="80" y="240" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Batch: NX-88419</text>
  <text x="80" y="260" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Mfg: 01/2026</text>
  <text x="80" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Exp: 01/2029</text>
  
  <!-- Barcode -->
  <rect x="80" y="320" width="180" height="35" fill="#f1f5f9" stroke="#cbd5e1"/>
  <line x1="90" y1="325" x2="90" y2="350" stroke="#000" stroke-width="2"/>
  <line x1="95" y1="325" x2="95" y2="350" stroke="#000" stroke-width="3"/>
  <line x1="102" y1="325" x2="102" y2="350" stroke="#000" stroke-width="1"/>
  <line x1="108" y1="325" x2="108" y2="350" stroke="#000" stroke-width="4"/>
  <line x1="118" y1="325" x2="118" y2="350" stroke="#000" stroke-width="2"/>
  <line x1="125" y1="325" x2="125" y2="350" stroke="#000" stroke-width="3"/>
  <line x1="135" y1="325" x2="135" y2="350" stroke="#000" stroke-width="1"/>
  <line x1="145" y1="325" x2="145" y2="350" stroke="#000" stroke-width="4"/>
  <text x="170" y="343" font-family="monospace" font-size="10" fill="#334155">894102501452</text>
  
  <!-- Blister Pack -->
  <rect x="310" y="100" width="230" height="260" rx="12" fill="url(#foilGrad)" stroke="#64748b" stroke-width="2" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.15))"/>
  <!-- Blister bubbles -->
  <circle cx="360" cy="150" r="24" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="430" cy="150" r="24" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="500" cy="150" r="24" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="360" cy="220" r="24" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="430" cy="220" r="24" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="500" cy="220" r="24" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Embossed Date on Foil -->
  <rect x="330" y="280" width="190" height="40" rx="6" fill="#475569"/>
  <text x="340" y="305" font-family="'Segoe UI', monospace" font-size="11" font-weight="bold" fill="#f8fafc">EMBOSSED: EXP 01/2029</text>
  
  <!-- Marker points banner -->
  <rect x="30" y="400" width="540" height="32" rx="8" fill="#047857"/>
  <text x="50" y="421" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff">🔍 GENUINE MARKERS: Clear 3D Hologram, Deep Foil Embossing, Crisp Beximco Logo &amp; DGDA DAR Number</text>
</svg>
