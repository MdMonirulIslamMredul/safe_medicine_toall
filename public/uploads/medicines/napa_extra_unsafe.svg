<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgUnsafe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="fakeFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="450" fill="url(#bgUnsafe)" rx="16"/>
  <rect x="2" y="2" width="596" height="446" fill="none" stroke="#ef4444" stroke-width="3" rx="14"/>
  
  <!-- Top Tag -->
  <rect x="30" y="24" width="260" height="34" rx="17" fill="#dc2626"/>
  <text x="45" y="47" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">⚠️ COUNTERFEIT / FAKE DRUG</text>
  
  <!-- Fake Box Illustration -->
  <rect x="60" y="80" width="220" height="300" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4" filter="drop-shadow(0 10px 15px rgba(239,68,68,0.15))"/>
  
  <!-- Discolored / Wrong Font Header -->
  <rect x="60" y="80" width="220" height="70" rx="10 10 0 0" fill="#3b82f6"/>
  <text x="80" y="125" font-family="'Comic Sans MS', cursive, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Napa Extra</text>
  
  <!-- Red Flag Callout 1: Font/Color mismatch -->
  <circle cx="250" cy="115" r="14" fill="#dc2626"/>
  <text x="246" y="120" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff">!</text>
  <text x="80" y="142" font-family="sans-serif" font-size="10" fill="#fecaca">Paracetamol 500mg (Spelling / Font error)</text>
  
  <!-- Fake Printed Hologram (Flat yellow box) -->
  <rect x="180" y="165" width="80" height="40" rx="4" fill="#eab308" stroke="#ca8a04"/>
  <text x="188" y="188" font-family="sans-serif" font-size="9" font-weight="bold" fill="#713f12">FLAT STICKER</text>
  <text x="188" y="199" font-family="sans-serif" font-size="8" fill="#713f12">(NO 3D EFFECT)</text>
  <circle cx="265" cy="165" r="12" fill="#dc2626"/>
  <text x="261" y="170" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff">!</text>
  
  <!-- Misspelled Company -->
  <text x="80" y="185" font-family="sans-serif" font-size="11" font-weight="bold" fill="#dc2626">Bexmco Pharma (Typo!)</text>
  <text x="80" y="220" font-family="sans-serif" font-size="10" fill="#991b1b">DAR: MISSING / FAKE</text>
  <text x="80" y="240" font-family="sans-serif" font-size="10" fill="#475569">Batch: NX-0099 (Unregistered)</text>
  
  <!-- Blurry / Fake Barcode -->
  <rect x="80" y="320" width="180" height="35" fill="#fee2e2" stroke="#f87171"/>
  <text x="100" y="342" font-family="monospace" font-size="11" fill="#991b1b">⚠️ INVALID BARCODE</text>
  
  <!-- Cheap Fake Blister -->
  <rect x="310" y="100" width="230" height="260" rx="12" fill="url(#fakeFoil)" stroke="#f87171" stroke-width="2" stroke-dasharray="4 4" filter="drop-shadow(0 10px 15px rgba(239,68,68,0.15))"/>
  
  <!-- Defective Pills (Chalky / Uneven) -->
  <circle cx="360" cy="150" r="24" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <circle cx="430" cy="150" r="22" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="500" cy="150" r="25" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5"/>
  
  <circle cx="360" cy="220" r="24" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <circle cx="430" cy="220" r="23" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <circle cx="500" cy="220" r="24" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  
  <!-- Missing Foil Embossing Warning -->
  <rect x="330" y="280" width="190" height="40" rx="6" fill="#b91c1c"/>
  <text x="340" y="305" font-family="'Segoe UI', monospace" font-size="10" font-weight="bold" fill="#ffffff">⚠️ INK PRINTED (NO EMBOSSING)</text>
  
  <!-- Bottom Warning Banner -->
  <rect x="30" y="400" width="540" height="32" rx="8" fill="#991b1b"/>
  <text x="45" y="421" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">❌ RED FLAGS: Flat Fake Hologram, Misspelled Company, Ink Stamp instead of Foil Embossing</text>
</svg>
