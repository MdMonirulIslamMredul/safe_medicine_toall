<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgUnsafeSeclo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bgUnsafeSeclo)" rx="16"/>
  <rect x="2" y="2" width="596" height="446" fill="none" stroke="#dc2626" stroke-width="3" rx="14"/>
  
  <rect x="30" y="24" width="260" height="34" rx="17" fill="#dc2626"/>
  <text x="45" y="47" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">⚠️ COUNTERFEIT / FAKE DRUG</text>
  
  <!-- Box -->
  <rect x="60" y="80" width="220" height="300" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 3" filter="drop-shadow(0 10px 15px rgba(239,68,68,0.15))"/>
  <rect x="60" y="80" width="220" height="70" rx="10 10 0 0" fill="#0284c7" opacity="0.8"/>
  <text x="80" y="125" font-family="'Arial Black', sans-serif" font-size="22" fill="#ffffff">Seclo-20</text>
  <text x="80" y="142" font-family="sans-serif" font-size="10" fill="#fecaca">Omeprazol 20mg (Spelling mistake!)</text>
  
  <!-- Blurry Logo -->
  <rect x="80" y="170" width="28" height="28" fill="#fda4af"/>
  <text x="88" y="189" font-family="sans-serif" font-size="14" font-weight="bold" fill="#881337">S</text>
  <text x="115" y="188" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">SQUAR PHARMA (Typo!)</text>
  
  <!-- Fake sticker -->
  <rect x="80" y="215" width="85" height="42" rx="4" fill="#fef08a" stroke="#ca8a04"/>
  <text x="88" y="238" font-family="sans-serif" font-size="9" font-weight="bold" fill="#713f12">CHEAP STICKER</text>
  <text x="88" y="250" font-family="sans-serif" font-size="8" fill="#713f12">NO COLOR SHIFT</text>
  
  <text x="80" y="280" font-family="sans-serif" font-size="10" fill="#dc2626">DAR: INVALID / MISSING</text>
  <text x="80" y="300" font-family="sans-serif" font-size="10" fill="#475569">Batch: SQ-0000</text>
  
  <!-- Defective blister -->
  <rect x="310" y="100" width="230" height="260" rx="12" fill="#e2e8f0" stroke="#f87171" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="330" y="270" width="190" height="50" rx="8" fill="#7f1d1d"/>
  <text x="340" y="295" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fca5a5">❌ FAKE PLASTIC STRIP</text>
  <text x="340" y="310" font-family="sans-serif" font-size="9" fill="#fee2e2">Paper backed instead of Alu-Alu</text>
  
  <rect x="30" y="400" width="540" height="32" rx="8" fill="#991b1b"/>
  <text x="45" y="421" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">❌ RED FLAGS: "Squar" typo, paper-backed blister, missing DGDA registration</text>
</svg>
